<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - Buy & Sell Anything</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --price-color: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 5%;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
    }

    .brand span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .btn-sell {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.6rem 1.4rem;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-sell:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Hero & Search Bar */
    .hero {
      padding: 3rem 1rem 2rem;
      text-align: center;
      background: radial-gradient(circle at top, rgba(16, 185, 129, 0.15), transparent 70%);
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
    }

    .search-box {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      padding: 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.8rem 1rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .search-box button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0 1.5rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Categories Bar */
    .categories {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem 1rem;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Main Product Grid */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.5rem 4rem;
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      color: var(--text-main);
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    /* Product Card */
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(16, 185, 129, 0.5);
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #1e293b;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--price-color);
      margin-bottom: 0.4rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
      display: flex;
      justify-content: space-between;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand">Trade<span>Hub</span></a>
    <div class="header-actions">
      <button class="btn-sell" id="sellBtn">+ SELL ITEM</button>
    </div>
  </header>

  <section class="hero">
    <h1>Find local deals on electronics, cars, and more</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for phones, bikes, furniture...">
      <button id="searchBtn">Search</button>
    </div>
  </section>

  <div class="categories">
    <button class="cat-btn active" data-category="all">All</button>
    <button class="cat-btn" data-category="electronics">Electronics</button>
    <button class="cat-btn" data-category="vehicles">Vehicles</button>
    <button class="cat-btn" data-category="furniture">Furniture</button>
  </div>

  <main>
    <h2 class="section-title">Fresh Recommendations</h2>
    <div class="listings-grid" id="grid">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <footer>
    &copy; 2026 TradeHub Marketplace. Static GitHub Demo.
  </footer>

  <script>
    // Sample Marketplace Data
    const products = [
      { id: 1, title: 'iPhone 13 Pro - 128GB', price: '$580', category: 'electronics', location: 'Downtown', date: '2 days ago', img: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&auto=format&fit=crop' },
      { id: 2, title: 'Mountain Bike 21-Speed', price: '$210', category: 'vehicles', location: 'West End', date: 'Today', img: 'https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=400&auto=format&fit=crop' },
      { id: 3, title: 'Ergonomic Office Chair', price: '$95', category: 'furniture', location: 'Northside', date: 'Yesterday', img: 'https://images.unsplash.com/photo-1580481072645-022f9a6d1270?w=400&auto=format&fit=crop' },
      { id: 4, title: 'Sony WH-1000XM4 Headphones', price: '$180', category: 'electronics', location: 'Metro Area', date: '3 days ago', img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&auto=format&fit=crop' },
      { id: 5, title: 'Vintage Wooden Coffee Table', price: '$140', category: 'furniture', location: 'Downtown', date: 'Today', img: 'https://images.unsplash.com/photo-1533090161767-e6ffed986c88?w=400&auto=format&fit=crop' },
      { id: 6, title: 'Electric Scooter 30km/h', price: '$320', category: 'vehicles', location: 'East Side', date: '4 days ago', img: 'https://images.unsplash.com/photo-1597082618499-0d85915d3148?w=400&auto=format&fit=crop' }
    ];

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const catBtns = document.querySelectorAll('.cat-btn');

    // Render items into grid
    function renderListings(items) {
      grid.innerHTML = items.map(item => `
        <div class="product-card">
          <img src="${item.img}" class="card-img" alt="${item.title}">
          <div class="card-body">
            <div class="card-price">${item.price}</div>
            <div class="card-title">${item.title}</div>
            <div class="card-meta">
              <span>${item.location}</span>
              <span>${item.date}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Filter by Category
    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const cat = btn.dataset.category;
        const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
        renderListings(filtered);
      });
    });

    // Real-time Search Filter
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = products.filter(p => p.title.toLowerCase().includes(term));
      renderListings(filtered);
    });

    // Initial Render
    renderListings(products);
  </script>
</body>
</html>
